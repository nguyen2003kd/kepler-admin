stages:
  - test
  - build
  - deploy

test_job:
  stage: test
  script:
    - echo "Skip, chưa có unit test"
  tags:
    - runner-vpd-que
  only:
    - release/staging

build_job:
  stage: build
  before_script:
    - check=$(echo "$CI_COMMIT_MESSAGE" | sed -nE 's/^.*(\[tag\]staging).*$/\1/p')
    - |
      if [ "$check" != "[tag]staging" ]; then
        echo "Commit message does not contain [tag]staging → skip pipeline"
        exit 0
      fi
  script:
    - bash cicd/build.sh
  tags:
    - runner-vpd-que
  only:
    - release/staging

deploy_job:
  stage: deploy
  before_script:
    - check=$(echo "$CI_COMMIT_MESSAGE" | sed -nE 's/^.*(\[tag\]staging).*$/\1/p')
    - |
      if [ "$check" != "[tag]staging" ]; then
        echo "Commit message does not contain [tag]staging → skip pipeline"
        exit 0
      fi
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -p $SERVER_SSH_PORT -H $SERVER_HOST >> ~/.ssh/known_hosts
    - mkdir -p /tmp/ssh-mux
    - ssh -p $SERVER_SSH_PORT -M -S /tmp/ssh-mux/master -fnN $SERVER_USER@$SERVER_HOST
    - echo "SSH master connection established"
  script:
    - bash cicd/deploy.sh
    - bash cicd/healthcheck.sh
  after_script:
    - ssh -S /tmp/ssh-mux/master -O exit $SERVER_USER@$SERVER_HOST 2>/dev/null || true
  tags:
    - runner-vpd-que
  only:
    - release/staging